<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Axium · Доска</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#172b4d; --mute:#6b778c;
    --line:#dfe1e6; --red:#de350b; --amber:#ff8b00; --green:#36b37e;
    --blue:#0052cc; --violet:#6554c0;
    --p1:#6554c0; --p2:#e5478a; --p3:#ff5630; --p0:#5e6c84;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px; margin:0 auto; padding:16px 16px 64px}

  header{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px}
  h1{font-size:20px; margin:0; letter-spacing:-.2px}
  .upd{color:var(--mute); font-size:12px}
  .upd button{
    border:0; background:none; color:var(--blue); cursor:pointer;
    font:inherit; padding:0 0 0 6px; text-decoration:underline;
  }

  .meter{
    display:flex; align-items:center; gap:10px; background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:12px 0 16px;
  }
  .meter b{font-size:22px; line-height:1}
  .meter .bar{flex:1; height:6px; background:var(--line); border-radius:3px; overflow:hidden}
  .meter .bar i{display:block; height:100%; background:var(--green); transition:width .4s}
  .meter.over .bar i{background:var(--red)}
  .meter small{color:var(--mute); font-size:12px}

  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
  .chip{
    border:1px solid var(--line); background:var(--card); color:var(--ink);
    border-radius:999px; padding:5px 12px; font-size:13px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .chip .n{opacity:.6; font-size:12px}

  h2{
    font-size:12px; text-transform:uppercase; letter-spacing:.7px; color:var(--mute);
    margin:24px 0 8px; display:flex; align-items:center; gap:8px;
  }
  h2 .count{
    background:var(--line); color:var(--mute); border-radius:999px;
    padding:1px 7px; font-size:11px; letter-spacing:0;
  }
  h2.hot{color:var(--red)} h2.hot .count{background:#ffebe6; color:var(--red)}
  h2.wait{color:var(--amber)} h2.wait .count{background:#fff7e6; color:var(--amber)}

  .card{
    display:block; text-decoration:none; color:inherit; background:var(--card);
    border:1px solid var(--line); border-left:3px solid var(--p0);
    border-radius:8px; padding:10px 12px; margin-bottom:6px;
  }
  .card:hover{border-color:#c1c7d0; border-left-color:inherit}
  .card .t{font-weight:500}
  .card .m{display:flex; gap:10px; flex-wrap:wrap; margin-top:3px; font-size:12px; color:var(--mute)}
  .card .m .who{color:var(--ink); font-weight:500}
  .card .m .late{color:var(--red); font-weight:500}
  .card .m .days{color:var(--amber); font-weight:500}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:1px}

  details summary{
    cursor:pointer; font-size:12px; text-transform:uppercase; letter-spacing:.7px;
    color:var(--mute); margin:24px 0 8px; list-style:none;
  }
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"▸ "}
  details[open] summary::before{content:"▾ "}

  .empty{color:var(--mute); padding:28px 0; text-align:center}
  .err{
    background:#ffebe6; border:1px solid #ffbdad; color:var(--red);
    border-radius:8px; padding:14px; margin-top:16px;
  }
  @media (max-width:480px){ .wrap{padding:12px 12px 56px} h1{font-size:18px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Axium · Доска</h1>
    <div class="upd" id="upd">загружаю…</div>
  </header>

  <div class="meter" id="meter" hidden>
    <b id="wc">0</b>
    <div class="bar"><i id="wbar" style="width:0%"></i></div>
    <small id="wtext"></small>
  </div>

  <div class="chips" id="people"></div>
  <div class="chips" id="projects"></div>

  <div id="out"><div class="empty">загружаю…</div></div>
</div>

<script>
/* ── настройки ─────────────────────────────────────────────── */
const API_URL = 'https://script.google.com/macros/s/AKfycbzBWd4uyyfDpYFpPw9EAl_Adtm6e4mAiniJgj2uBRmBkP5G5zhpqmqu1cF1BFzKp-pR/exec';
const KEY = new URLSearchParams(location.search).get('k') || '';

/* цвет проекта по первому слову названия */
const COLORS = [
  [/призван/i, 'var(--p1)'],
  [/cosmica|космик/i, 'var(--p2)'],
  [/картинг|racing/i, 'var(--p3)']
];
const colorOf = p => (COLORS.find(c => c[0].test(p)) || [null, 'var(--p0)'])[1];

const DAYS = ['вс','пн','вт','ср','чт','пт','сб'];
const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

let DATA = null, fPerson = null, fProject = null;

/* ── загрузка ──────────────────────────────────────────────── */
async function load(fresh) {
  if (!KEY) return fail('Открой страницу со ссылкой вида …/?k=ключ');
  try {
    const r = await fetch(API_URL + '?k=' + encodeURIComponent(KEY) + (fresh ? '&fresh=1' : ''));
    const d = await r.json();
    if (d.error) return fail('Доступ не подтверждён. Проверь ключ в адресе.');
    DATA = d;
    render();
  } catch (e) {
    fail('Не удалось получить данные: ' + e.message);
  }
}

function fail(msg) {
  document.getElementById('upd').textContent = '';
  document.getElementById('out').innerHTML = '<div class="err">' + esc(msg) + '</div>';
}

/* ── отрисовка ─────────────────────────────────────────────── */
function render() {
  const d = DATA;

  document.getElementById('upd').innerHTML =
    'обновлено ' + esc(d.updated) + '<button onclick="load(1)">обновить</button>';

  const m = document.getElementById('meter');
  m.hidden = false;
  m.classList.toggle('over', d.weekCount > d.weekLimit);
  document.getElementById('wc').textContent = d.weekCount;
  document.getElementById('wbar').style.width =
    Math.min(100, d.weekCount / d.weekLimit * 100) + '%';
  document.getElementById('wtext').textContent =
    d.weekCount > d.weekLimit
      ? 'задач на неделе — перебор, предел ' + d.weekLimit
      : 'задач на этой неделе из ' + d.weekLimit;

  chips('people', [...new Set(d.items.map(x => x.owner).filter(Boolean))].sort(),
        fPerson, v => { fPerson = v; render(); });
  chips('projects', [...new Set(d.items.map(x => x.project))].sort(),
        fProject, v => { fProject = v; render(); }, true);

  const items = d.items.filter(x =>
    (!fPerson || x.owner === fPerson) && (!fProject || x.project === fProject));

  const out = [];
  const late = items.filter(x => x.status === 'overdue')
                    .sort((a, b) => (a.due || '').localeCompare(b.due || ''));
  const wait = items.filter(x => x.status === 'waiting')
                    .sort((a, b) => (b.waitingDays || 0) - (a.waitingDays || 0));
  const week = items.filter(x => x.status === 'week');
  const none = items.filter(x => x.status === 'noDate');
  const next = items.filter(x => x.status === 'later')
                    .sort((a, b) => (a.due || '').localeCompare(b.due || ''));

  if (late.length) out.push(sec('Просрочено', late, 'hot'));

  const byDay = {};
  week.forEach(x => (byDay[x.dueDay] = byDay[x.dueDay] || []).push(x));
  Object.keys(byDay).sort().forEach(day => out.push(sec(dayLabel(day), byDay[day])));

  if (wait.length) out.push(sec('Ждём клиента', wait, 'wait'));
  if (none.length) out.push(sec('Без срока', none));
  if (next.length) out.push(fold('Дальше', next));

  document.getElementById('out').innerHTML =
    out.join('') || '<div class="empty">Ничего не найдено</div>';
}

function chips(id, vals, active, cb, color) {
  const box = document.getElementById(id);
  box.innerHTML = '';
  if (vals.length < 2) return;
  const mk = (label, val, dot) => {
    const b = document.createElement('button');
    b.className = 'chip' + (active === val ? ' on' : '');
    b.innerHTML = (dot ? '<i class="dot" style="background:' + colorOf(val) + '"></i>' : '') + esc(label);
    b.onclick = () => cb(active === val ? null : val);
    box.appendChild(b);
  };
  mk('все', null, false);
  vals.forEach(v => mk(v, v, color));
}

function sec(title, arr, cls) {
  return '<h2 class="' + (cls || '') + '">' + esc(title) +
         '<span class="count">' + arr.length + '</span></h2>' +
         arr.map(card).join('');
}

function fold(title, arr) {
  return '<details><summary>' + esc(title) + ' · ' + arr.length + '</summary>' +
         arr.map(card).join('') + '</details>';
}

function card(x) {
  const meta = [];
  if (x.owner) meta.push('<span class="who">' + esc(x.owner) + '</span>');
  meta.push('<span><i class="dot" style="background:' + colorOf(x.project) + '"></i>' +
            esc(x.project) + '</span>');
  if (x.status === 'overdue')
    meta.push('<span class="late">просрочено ' + esc(shortDate(x.due)) + '</span>');
  else if (x.status === 'waiting' && x.waitingDays != null)
    meta.push('<span class="days">без движения ' + x.waitingDays + ' ' + plural(x.waitingDays) + '</span>');
  else if (x.due)
    meta.push('<span>' + esc(shortDate(x.due)) + '</span>');

  return '<a class="card" style="border-left-color:' + colorOf(x.project) + '" ' +
         'href="' + esc(x.url) + '" target="_blank" rel="noopener">' +
         '<div class="t">' + esc(x.title) + '</div>' +
         '<div class="m">' + meta.join('') + '</div></a>';
}

/* ── мелочи ────────────────────────────────────────────────── */
function dayLabel(iso) {
  const d = new Date(iso + 'T12:00:00');
  const t = new Date(); t.setHours(12, 0, 0, 0);
  const diff = Math.round((d - t) / 86400000);
  const base = DAYS[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  if (diff === 0) return 'Сегодня · ' + base;
  if (diff === 1) return 'Завтра · ' + base;
  return base.charAt(0).toUpperCase() + base.slice(1);
}

function shortDate(s) {
  if (!s) return '';
  const d = new Date(s.replace(' ', 'T') + ':00');
  return d.getDate() + ' ' + MONTHS[d.getMonth()] +
         (s.slice(11) !== '09:00' ? ', ' + s.slice(11) : '');
}

const plural = n => (n % 10 === 1 && n % 100 !== 11) ? 'день'
  : ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) ? 'дня' : 'дней';

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

load();
setInterval(() => load(), 300000);
</script>
</body>
</html>
