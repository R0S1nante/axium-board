<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Axium · Офис</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:#0b0e12; overflow:hidden; height:100vh;
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .room{
    position:relative; width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16/9; overflow:hidden;
    background:#cbb9a4 center/cover no-repeat; background-image:url('office.png');
  }
  .room::before{
    content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:
      linear-gradient(180deg, rgba(8,11,15,.55) 0%, rgba(8,11,15,0) 26%),
      linear-gradient(0deg,  rgba(8,11,15,.6) 0%,  rgba(8,11,15,0) 24%);
  }

  /* ── титул ── */
  .brand{position:absolute; left:3.2%; top:6%; z-index:6; animation:in .9s both .15s}
  .brand .live{
    display:inline-flex; align-items:center; gap:6px; font-size:.62em;
    letter-spacing:2.4px; text-transform:uppercase; color:#ffd43b; margin-bottom:4px;
  }
  .brand .live i{
    width:6px; height:6px; border-radius:50%; background:#ffd43b;
    animation:pulse 1.9s ease-in-out infinite;
  }
  .brand h1{
    font-size:3.1em; font-weight:800; letter-spacing:-1.5px; line-height:.92;
    text-shadow:0 4px 24px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.5);
  }
  .brand h1 em{font-style:normal; color:#ffd43b}
  .brand p{
    font-size:.76em; letter-spacing:3.4px; text-transform:uppercase;
    opacity:.75; margin-top:7px; text-shadow:0 2px 10px rgba(0,0,0,.7);
  }
  .brand .line{width:54px; height:2px; background:#ffd43b; margin:11px 0 0; border-radius:2px}

  /* ── счётчики ── */
  .stats{
    position:absolute; right:3.2%; top:7%; z-index:6; display:flex; gap:22px;
    text-align:right; animation:in .9s both .35s;
  }
  .stats div{text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .stats b{display:block; font-size:2em; font-weight:750; line-height:1}
  .stats span{font-size:.64em; letter-spacing:1.6px; text-transform:uppercase; opacity:.7}
  .stats .r b{color:#ff8a6b} .stats .y b{color:#ffd43b} .stats .g b{color:#7bdcb5}

  /* ── нижняя выплывающая полка ── */
  .dock{
    position:absolute; left:50%; bottom:0; z-index:7; width:72%;
    transform:translate(-50%, calc(100% - 2.4em));
    transition:transform .55s cubic-bezier(.3,.8,.3,1);
  }
  .dock.open, .dock:hover{transform:translate(-50%, 0)}
  .dock .handle{
    margin:0 auto; width:max-content; cursor:default;
    background:rgba(12,15,20,.82); backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14); border-bottom:0;
    border-radius:12px 12px 0 0; padding:6px 20px 7px;
    font-size:.7em; letter-spacing:1.6px; text-transform:uppercase;
  }
  .dock .handle b{color:#ffd43b; margin-left:7px}
  .dock .handle::after{content:' ▴'; opacity:.5}
  .dock.open .handle::after, .dock:hover .handle::after{content:' ▾'}
  .dock .shelf{
    display:flex; gap:9px; padding:12px; background:rgba(12,15,20,.82);
    backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.14);
    border-radius:14px 14px 0 0; margin-top:-1px;
  }
  .task{
    flex:1 1 0; min-width:0; background:rgba(255,255,255,.07);
    border-radius:10px; padding:9px 11px; border-left:3px solid #9aa7b8;
  }
  .task.late{background:rgba(222,53,11,.2); border-left-color:#ff6b45}
  .task b{display:block; font-size:.74em; font-weight:500; line-height:1.3;
          overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .task small{display:block; font-size:.64em; opacity:.55; margin-top:4px}

  /* ── люди ── */
  .guy{
    position:absolute; z-index:4; width:4.6%; transform:translateX(-50%);
    transition:left 2.6s cubic-bezier(.45,.05,.3,1), top 2.6s cubic-bezier(.45,.05,.3,1);
  }
  .guy:hover{z-index:9}
  .guy svg{position:relative; width:100%; display:block;
           filter:drop-shadow(0 7px 11px rgba(0,0,0,.4))}
  .guy .spot{
    position:absolute; left:50%; bottom:-5%; width:140%; height:15%;
    transform:translateX(-50%); border-radius:50%;
    background:rgba(255,212,59,.7); box-shadow:0 0 16px rgba(255,212,59,.55);
  }
  .guy.walk .leg-l{animation:step .46s linear infinite}
  .guy.walk .leg-r{animation:step .46s linear infinite .23s}
  .guy .torso{animation:idle 2.8s ease-in-out infinite}
  .guy.walk .torso{animation:bob .46s ease-in-out infinite}

  .tag{
    position:absolute; left:50%; top:101%; transform:translateX(-50%);
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:rgba(12,15,20,.86); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.16); border-radius:999px;
    padding:3px 10px; font-size:.62em; font-weight:600;
  }
  .tag u{text-decoration:none}
  .tag i{
    font-style:normal; background:#ffd43b; color:#1b1b1b; border-radius:999px;
    min-width:15px; text-align:center; padding:0 4px; font-size:.9em;
  }
  .tag i.hot{background:#ff5630; color:#fff}

  /* карточка задач человека — только при наведении */
  .card{
    position:absolute; left:50%; bottom:118%; transform:translateX(-50%) translateY(8px);
    width:16.5vw; min-width:190px; max-width:280px;
    background:rgba(255,255,255,.97); color:#16202f; border-radius:13px;
    box-shadow:0 14px 36px rgba(0,0,0,.4); padding:10px 11px;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .guy:hover .card{opacity:1; transform:translateX(-50%) translateY(0)}
  .card::after{
    content:''; position:absolute; left:50%; top:100%; transform:translateX(-50%);
    border:7px solid transparent; border-top-color:rgba(255,255,255,.97);
  }
  .card h3{font-size:.66em; letter-spacing:1.4px; text-transform:uppercase;
           color:#8b95a7; margin-bottom:7px}
  .card .it{display:flex; gap:7px; align-items:flex-start; padding:4px 0}
  .card .it + .it{border-top:1px solid #eef0f3}
  .card .it s{width:3px; align-self:stretch; border-radius:2px; text-decoration:none; flex:none}
  .card .it b{font-size:.73em; font-weight:500; line-height:1.3; display:block}
  .card .it small{font-size:.63em; color:#8b95a7}
  .card .it.late b{color:#b3310a}
  .card .none{font-size:.72em; color:#8b95a7}

  @keyframes step{0%{transform:rotate(17deg)}50%{transform:rotate(-17deg)}100%{transform:rotate(17deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5%)}}
  @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-.5%)}}
  @keyframes in{from{opacity:0; transform:translateY(-12px)}to{opacity:1; transform:none}}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1)}50%{opacity:.35; transform:scale(.8)}}
</style>
</head>
<body>
<div class="room" id="room">

  <div class="brand">
    <div class="live"><i></i>live</div>
    <h1>AXIUM<br><em>офис</em></h1>
    <div class="line"></div>
    <p id="sub">загружаю…</p>
  </div>

  <div class="stats">
    <div class="r"><b id="tHot">0</b><span>срочных</span></div>
    <div class="y"><b id="tWeek">0</b><span>на неделе</span></div>
    <div class="g"><b id="tPool">0</b><span>в бэклоге</span></div>
  </div>

  <div class="dock" id="dock">
    <div class="handle">сегодня в работе<b id="dockN">0</b></div>
    <div class="shelf" id="shelf"></div>
  </div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzBWd4uyyfDpYFpPw9EAl_Adtm6e4mAiniJgj2uBRmBkP5G5zhpqmqu1cF1BFzKp-pR/exec';
const KEY = new URLSearchParams(location.search).get('k') || '';

const HEX = { 'Призвание':'#8f7dff', 'Cosmica':'#ff6ea8', 'Racing Stars':'#ff7a4d', 'Общее':'#93a1b3' };
const SHIRT = ['#4c6ef5','#12b886','#f59f00','#e8590c','#845ef7','#15aabf'];
const HAIR  = ['#2b2420','#4a3426','#17161a','#6b4a2f','#2f2b45','#3a2b22'];
const MONTHS = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

const SPOTS = [
  { x:37, y:60 }, { x:50, y:74 }, { x:63, y:60 }, { x:72, y:76 },
  { x:43, y:84 }, { x:66, y:48 }
];

let DATA = null;

async function load() {
  if (!KEY) { sub('нужен ключ в адресе: ?k=…'); return; }
  try {
    const r = await fetch(API_URL + '?k=' + encodeURIComponent(KEY));
    const d = await r.json();
    if (d.error) { sub('доступ не подтверждён'); return; }
    DATA = d; draw();
  } catch (e) { sub('нет связи с доской'); }
}
const sub = t => document.getElementById('sub').textContent = t;

function draw() {
  const items = DATA.items.filter(x => x.status !== 'waiting');
  const hot  = items.filter(x => x.urgent || x.status === 'overdue' || !(x.owners || []).length);
  const week = items.filter(x => x.status === 'week' || x.status === 'overdue');
  const pool = items.filter(x => x.status === 'noDate' || x.status === 'later');

  sub('доска задач · ' + DATA.updated.slice(11));
  document.getElementById('tHot').textContent = hot.length;
  document.getElementById('tWeek').textContent = week.length;
  document.getElementById('tPool').textContent = pool.length;

  /* нижняя полка */
  const base = (week.length ? week : items.filter(x => x.due)).slice().sort(r0);
  document.getElementById('dockN').textContent = base.length;
  document.getElementById('shelf').innerHTML = base.slice(0, 5).map(x =>
    '<div class="task' + (x.status === 'overdue' ? ' late' : '') +
    '" style="border-left-color:' + (HEX[x.project] || '#93a1b3') + '">' +
    '<b>' + esc(x.title) + '</b><small>' + esc(x.owner || 'ничья') + ' · ' +
    esc(x.status === 'overdue' ? 'просрочено' : when(x)) + '</small></div>').join('')
    || '<div class="task"><b>Пока пусто</b><small>ни одной задачи на неделе</small></div>';

  /* люди */
  const names = [...new Set(DATA.items.flatMap(x => x.owners || []))].sort();
  const room = document.getElementById('room');
  [...room.querySelectorAll('.guy')].forEach(g => g.remove());

  names.forEach((name, i) => {
    const mine = items.filter(t => (t.owners || []).includes(name)).sort(r0);
    const late = mine.filter(t => t.status === 'overdue').length;
    const soon = mine.filter(t => t.status === 'week' || t.status === 'overdue').length;

    const el = document.createElement('div');
    el.className = 'guy';
    el.style.left = SPOTS[i % SPOTS.length].x + '%';
    el.style.top  = SPOTS[i % SPOTS.length].y + '%';
    el.innerHTML =
      card(name, mine) + figure(SHIRT[i % 6], HAIR[i % 6]) +
      '<div class="spot"></div>' +
      '<div class="tag"><u>' + esc(name) + '</u>' +
      (soon ? '<i class="' + (late ? 'hot' : '') + '">' + soon + '</i>' : '') + '</div>';
    room.appendChild(el);
  });

  wander();
  breathe();
}

function card(name, tasks) {
  const body = tasks.length
    ? tasks.slice(0, 6).map(t =>
        '<div class="it' + (t.status === 'overdue' ? ' late' : '') + '">' +
        '<s style="background:' + (HEX[t.project] || '#93a1b3') + '"></s><span><b>' +
        esc(t.title) + '</b><small>' + esc(t.project) + ' · ' +
        esc(t.status === 'overdue' ? 'просрочено' : when(t)) + '</small></span></div>').join('') +
      (tasks.length > 6 ? '<div class="none" style="padding-top:6px">и ещё ' + (tasks.length - 6) + '</div>' : '')
    : '<div class="none">Свободен — можно отдать срочное</div>';
  return '<div class="card"><h3>' + esc(name) + '</h3>' + body + '</div>';
}

const r0 = (a, b) => rank(a) - rank(b) || ((a.due || '9').localeCompare(b.due || '9'));
const rank = x => x.status === 'overdue' ? 0 : x.status === 'week' ? 1 : x.status === 'noDate' ? 3 : 2;
const when = x => x.due ? (+x.due.slice(8, 10)) + ' ' + MONTHS[+x.due.slice(5, 7) - 1] : 'без срока';

/* полка сама выезжает раз в полминуты и прячется */
function breathe() {
  const d = document.getElementById('dock');
  if (d.dataset.on) return;
  d.dataset.on = 1;
  const show = () => {
    d.classList.add('open');
    setTimeout(() => d.classList.remove('open'), 7000);
  };
  setTimeout(show, 2500);
  setInterval(show, 30000);
}

/* кто-то время от времени переходит на другое место */
function wander() {
  if (window.__w) return;
  window.__w = setInterval(() => {
    const guys = [...document.querySelectorAll('.guy')];
    if (guys.length < 2) return;
    const g = guys[Math.floor(Math.random() * guys.length)];
    const free = SPOTS.filter(s =>
      !guys.some(o => Math.abs(parseFloat(o.style.left) - s.x) < 3));
    if (!free.length) return;
    const to = free[Math.floor(Math.random() * free.length)];
    g.classList.add('walk');
    g.style.left = to.x + '%';
    g.style.top  = to.y + '%';
    setTimeout(() => g.classList.remove('walk'), 2700);
  }, 9000);
}

function figure(shirt, hair) {
  return '<svg viewBox="0 0 40 96">' +
    '<g class="torso">' +
      '<circle cx="20" cy="17" r="11" fill="#f3d2b4"/>' +
      '<path d="M9 13 q11 -11 22 0 q-11 -4 -22 0z" fill="' + hair + '"/>' +
      '<rect x="8" y="27" width="24" height="33" rx="10" fill="' + shirt + '"/>' +
      '<rect x="4"  y="30" width="6" height="24" rx="3" fill="' + shirt + '"/>' +
      '<rect x="30" y="30" width="6" height="24" rx="3" fill="' + shirt + '"/>' +
    '</g>' +
    '<g class="leg-l" style="transform-origin:16px 58px">' +
      '<rect x="12" y="58" width="7" height="32" rx="3.5" fill="#2f3b52"/></g>' +
    '<g class="leg-r" style="transform-origin:24px 58px">' +
      '<rect x="21" y="58" width="7" height="32" rx="3.5" fill="#2f3b52"/></g>' +
    '</svg>';
}

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

load();
setInterval(load, 300000);
</script>
</body>
</html>
