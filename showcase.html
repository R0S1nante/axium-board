<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Axium · Офис</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0}
  body{
    background:#0e1116; overflow:hidden; height:100vh;
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .room{
    position:relative; width:min(100vw, calc(100vh * 16 / 9));
    aspect-ratio:16/9; overflow:hidden; background:#cbb9a4 center/cover no-repeat;
    background-image:url('office.png');
  }
  .room::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 45%, rgba(10,14,20,.42) 100%);
  }

  /* ── шапка ── */
  .plate{
    position:absolute; right:2.4%; top:5%; z-index:5; text-align:right;
    background:rgba(14,17,22,.72); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12); border-radius:14px;
    padding:12px 18px; animation:fadeDown .8s both .2s;
  }
  .plate h1{font-size:1.15em; letter-spacing:-.2px; font-weight:650}
  .plate h1 span{color:#ffd43b}
  .plate p{font-size:.72em; opacity:.6; margin-top:3px}

  /* ── правая панель ── */
  .panel{
    position:absolute; left:2.4%; top:5%; bottom:5%; width:22%; z-index:5;
    background:rgba(14,17,22,.72); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12); border-radius:14px;
    padding:14px; display:flex; flex-direction:column; gap:7px;
    animation:fadeDown .8s both .4s;
  }
  .panel h2{font-size:.68em; letter-spacing:1.2px; text-transform:uppercase; opacity:.5}
  .row{
    display:flex; gap:8px; align-items:flex-start;
    background:rgba(255,255,255,.06); border-radius:9px; padding:7px 9px;
    font-size:.72em; line-height:1.3; opacity:0;
    animation:rowIn .5s forwards;
  }
  .row i{width:3px; align-self:stretch; border-radius:2px; flex:none}
  .row b{display:block; font-weight:500}
  .row small{opacity:.5; font-size:.85em}
  .row.hot{background:rgba(222,53,11,.18)}
  .panel .more{font-size:.68em; opacity:.4; margin-top:auto; text-align:right}

  /* ── люди ── */
  .guy{
    position:absolute; z-index:4; width:3.4%;
    transition:left 2.6s cubic-bezier(.45,.05,.3,1);
    transform:translateX(-50%);
  }
  .guy .spot{
    position:absolute; left:50%; bottom:-6%; width:150%; height:16%;
    transform:translateX(-50%); border-radius:50%;
    background:rgba(255,212,59,.75); filter:blur(.5px);
    box-shadow:0 0 14px rgba(255,212,59,.5);
  }
  .guy svg{position:relative; width:100%; display:block; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
  .guy.walk .leg-l{animation:step .46s linear infinite}
  .guy.walk .leg-r{animation:step .46s linear infinite .23s}
  .guy .torso{animation:idle 2.6s ease-in-out infinite}
  .guy.walk .torso{animation:bob .46s ease-in-out infinite}
  .tag{
    position:absolute; left:50%; top:102%; transform:translateX(-50%);
    background:#ffd43b; color:#1b1b1b; font-size:.62em; font-weight:650;
    padding:2px 9px; border-radius:999px; white-space:nowrap;
  }
  .bubble{
    position:absolute; left:50%; bottom:112%; transform:translateX(-50%) translateY(6px);
    width:max-content; max-width:16vw;
    background:rgba(255,255,255,.95); color:#1b2434;
    font-size:.68em; line-height:1.25; padding:7px 10px; border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,.3); opacity:0;
    transition:opacity .5s, transform .5s;
  }
  .bubble.on{opacity:1; transform:translateX(-50%) translateY(0)}
  .bubble::after{
    content:''; position:absolute; left:50%; top:100%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:rgba(255,255,255,.95);
  }
  .bubble b{display:block; font-size:.82em; font-weight:600; opacity:.45; margin-bottom:1px}
  .bubble.late{background:#ffe3dc}
  .bubble.late b{color:#b3310a; opacity:1}

  /* ── нижняя строка ── */
  .ticker{
    position:absolute; right:2.4%; bottom:5%; z-index:5; display:flex; gap:10px;
    animation:fadeUp .8s both .6s;
  }
  .ticker div{
    background:rgba(14,17,22,.72); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.12); border-radius:11px;
    padding:8px 14px; font-size:.74em;
  }
  .ticker b{font-size:1.25em; font-weight:650; margin-right:5px}
  .ticker .r b{color:#ff7b5c}
  .ticker .y b{color:#ffd43b}
  .ticker .g b{color:#63e6be}

  @keyframes step{0%{transform:rotate(17deg)}50%{transform:rotate(-17deg)}100%{transform:rotate(17deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5%)}}
  @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-.6%)}}
  @keyframes fadeDown{from{opacity:0; transform:translateY(-14px)}to{opacity:1; transform:none}}
  @keyframes fadeUp{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
  @keyframes rowIn{to{opacity:1}}
</style>
</head>
<body>
<div class="room" id="room">
  <div class="plate">
    <h1>Axium · <span>офис</span></h1>
    <p id="sub">загружаю…</p>
  </div>

  <aside class="panel">
    <h2>Сегодня в работе</h2>
    <div id="rows"></div>
    <div class="more" id="more"></div>
  </aside>

  <div class="ticker">
    <div class="r"><b id="tHot">0</b>срочных</div>
    <div class="y"><b id="tWeek">0</b>на неделе</div>
    <div class="g"><b id="tPool">0</b>в бэклоге</div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzBWd4uyyfDpYFpPw9EAl_Adtm6e4mAiniJgj2uBRmBkP5G5zhpqmqu1cF1BFzKp-pR/exec';
const KEY = new URLSearchParams(location.search).get('k') || '';

const HEX = { 'Призвание':'#9b8cff', 'Cosmica':'#ff7ab0', 'Racing Stars':'#ff8a5c', 'Общее':'#9aa7b8' };
const SHIRT = ['#4c6ef5','#12b886','#f59f00','#e8590c','#845ef7','#15aabf'];
const HAIR  = ['#2b2420','#4a3426','#17161a','#6b4a2f','#2f2b45','#3a2b22'];

/* точки на полу — проценты от ширины и высоты комнаты.
   Подгоняются под картинку office.png. */
const SPOTS = [
  { x:40, y:70 }, { x:51, y:82 }, { x:62, y:70 }, { x:72, y:82 },
  { x:45, y:90 }, { x:68, y:56 }
];

let DATA = null;

async function load() {
  if (!KEY) { document.getElementById('sub').textContent = 'нужен ключ в адресе: ?k=…'; return; }
  try {
    const r = await fetch(API_URL + '?k=' + encodeURIComponent(KEY));
    const d = await r.json();
    if (d.error) { document.getElementById('sub').textContent = 'доступ не подтверждён'; return; }
    DATA = d; draw();
  } catch (e) {
    document.getElementById('sub').textContent = 'нет связи с доской';
  }
}

function draw() {
  const items = DATA.items.filter(x => x.status !== 'waiting');
  const hot  = items.filter(x => x.urgent || x.status === 'overdue' || !(x.owners || []).length);
  const week = items.filter(x => x.status === 'week' || x.status === 'overdue');
  const pool = items.filter(x => x.status === 'noDate' || x.status === 'later');

  document.getElementById('sub').textContent =
    'живая доска задач · обновлено ' + DATA.updated;
  document.getElementById('tHot').textContent = hot.length;
  document.getElementById('tWeek').textContent = week.length;
  document.getElementById('tPool').textContent = pool.length;

  /* правая панель */
  const show = week.slice().sort(r0).slice(0, 7);
  document.getElementById('rows').innerHTML = show.map((x, i) =>
    '<div class="row' + (x.status === 'overdue' ? ' hot' : '') + '" style="animation-delay:' +
    (0.6 + i * 0.12) + 's"><i style="background:' + (HEX[x.project] || '#9aa7b8') + '"></i>' +
    '<span><b>' + esc(cut(x.title, 46)) + '</b><small>' + esc(x.owner || 'ничья') + ' · ' +
    esc(x.project) + '</small></span></div>').join('');
  document.getElementById('more').textContent =
    week.length > 7 ? 'и ещё ' + (week.length - 7) : '';

  /* люди */
  const names = [...new Set(DATA.items.flatMap(x => x.owners || []))].sort();
  const room = document.getElementById('room');
  [...room.querySelectorAll('.guy')].forEach(g => g.remove());

  const used = SPOTS.slice(0, Math.max(names.length, 1));
  names.forEach((name, i) => {
    const mine = items.filter(t => (t.owners || []).includes(name)).sort(r0);
    const el = document.createElement('div');
    el.className = 'guy';
    el.dataset.i = i;
    el.style.left = used[i % used.length].x + '%';
    el.style.top  = used[i % used.length].y + '%';
    el.innerHTML =
      '<div class="bubble"></div>' + figure(SHIRT[i % 6], HAIR[i % 6]) +
      '<div class="spot"></div><div class="tag">' + esc(name) + '</div>';
    room.appendChild(el);
    cycle(el, mine, i);
  });

  wander();
}

const r0 = (a, b) => rank(a) - rank(b) ||
  ((a.due || '9').localeCompare(b.due || '9'));
const rank = x => x.status === 'overdue' ? 0 : x.status === 'week' ? 1 : x.status === 'noDate' ? 3 : 2;

/* реплика над головой: задачи человека по кругу */
function cycle(el, tasks, i) {
  const b = el.querySelector('.bubble');
  if (!tasks.length) {
    b.className = 'bubble';
    b.innerHTML = '<b>свободен</b>можно подхватить срочное';
    setTimeout(() => b.classList.add('on'), 1200 + i * 400);
    return;
  }
  let k = 0;
  const show = () => {
    const t = tasks[k % tasks.length];
    b.className = 'bubble' + (t.status === 'overdue' ? ' late' : '');
    b.innerHTML = '<b>' + esc(t.status === 'overdue' ? 'просрочено' : t.project) + '</b>' +
                  esc(cut(t.title, 52));
    b.classList.add('on');
    setTimeout(() => { b.classList.remove('on'); k++; }, 4200);
  };
  setTimeout(() => { show(); setInterval(show, 6000); }, 900 + i * 700);
}

/* кто-то время от времени переходит на другое место */
function wander() {
  setInterval(() => {
    const guys = [...document.querySelectorAll('.guy')];
    if (guys.length < 2) return;
    const g = guys[Math.floor(Math.random() * guys.length)];
    const free = SPOTS.filter(s =>
      !guys.some(o => Math.abs(parseFloat(o.style.left) - s.x) < 2));
    if (!free.length) return;
    const to = free[Math.floor(Math.random() * free.length)];
    g.classList.add('walk');
    g.style.left = to.x + '%';
    g.style.top = to.y + '%';
    setTimeout(() => g.classList.remove('walk'), 2700);
  }, 7000);
}

function figure(shirt, hair) {
  return '<svg viewBox="0 0 40 96">' +
    '<g class="torso">' +
      '<circle cx="20" cy="17" r="11" fill="#f3d2b4"/>' +
      '<path d="M9 13 q11 -11 22 0 q-11 -4 -22 0z" fill="' + hair + '"/>' +
      '<rect x="8" y="27" width="24" height="33" rx="10" fill="' + shirt + '"/>' +
      '<rect x="4"  y="30" width="6" height="24" rx="3" fill="' + shirt + '"/>' +
      '<rect x="30" y="30" width="6" height="24" rx="3" fill="' + shirt + '"/>' +
    '</g>' +
    '<g class="leg-l" style="transform-origin:16px 58px">' +
      '<rect x="12" y="58" width="7" height="32" rx="3.5" fill="#2f3b52"/></g>' +
    '<g class="leg-r" style="transform-origin:24px 58px">' +
      '<rect x="21" y="58" width="7" height="32" rx="3.5" fill="#2f3b52"/></g>' +
    '</svg>';
}

const cut = (s, n) => String(s).length > n ? String(s).slice(0, n - 1).trimEnd() + '…' : String(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

load();
setInterval(load, 300000);
</script>
</body>
</html>
